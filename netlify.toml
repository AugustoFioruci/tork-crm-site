[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/clinica/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A landing viva usa /clinica (singular), igual aos caminhos internos dos
# assets. /clinicas era uma copia antiga; redireciona para nao virar 404 em
# link ja compartilhado.
[[redirects]]
  from = "/clinicas"
  to = "/clinica/"
  status = 301
  force = true

[[redirects]]
  from = "/clinicas/*"
  to = "/clinica/:splat"
  status = 301
  force = true
